<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="visor" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" stop-opacity="1" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded app icon frame -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Stars -->
  <circle cx="90" cy="110" r="2" fill="#ffffff" opacity="0.8" />
  <circle cx="420" cy="140" r="2.5" fill="#38bdf8" opacity="0.9" />
  <circle cx="120" cy="390" r="1.5" fill="#ffffff" opacity="0.6" />
  <circle cx="430" cy="380" r="2" fill="#fbbf24" opacity="0.7" />
  <circle cx="250" cy="70" r="1.8" fill="#ffffff" opacity="0.8" />

  <!-- Distant Ringed Planet Behind Helmet -->
  <circle cx="360" cy="150" r="42" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <ellipse cx="360" cy="150" rx="72" ry="18" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.7" transform="rotate(-25 360 150)" />

  <!-- Outer Helmet Shell -->
  <path d="M 256,90 C 150,90 120,165 120,265 C 120,360 165,410 256,410 C 347,410 392,360 392,265 C 392,165 362,90 256,90 Z" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Glowing Cyan Helmet Accent Trim -->
  <path d="M 256,102 C 165,102 135,172 135,265 C 135,350 175,396 256,396 C 337,396 377,350 377,265 C 377,172 347,102 256,102 Z" fill="none" stroke="url(#cyanGlow)" stroke-width="4" filter="url(#glow)" />

  <!-- Helmet Visor -->
  <ellipse cx="256" cy="256" rx="98" ry="86" fill="url(#visor)" stroke="url(#goldGlow)" stroke-width="4" />

  <!-- Visor Planet Reflection -->
  <circle cx="280" cy="245" r="24" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" opacity="0.9" />
  <ellipse cx="280" cy="245" rx="42" ry="10" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.8" transform="rotate(-20 280 245)" />

  <!-- Visor Highlights -->
  <path d="M 180,210 Q 230,195 285,205" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Neck Collar & Support Ring -->
  <path d="M 170,410 L 342,410 L 320,442 L 192,442 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />

  <!-- Title Text: LAST HORIZON -->
  <text x="256" y="475" font-family="'Orbitron', sans-serif" font-size="24" font-weight="900" fill="#38bdf8" letter-spacing="4" text-anchor="middle">LAST HORIZON</text>
</svg>
